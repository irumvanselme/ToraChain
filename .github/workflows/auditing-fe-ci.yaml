name: auditing-fe-ci

on:
  workflow_call:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: formatting
        working-directory: ./auditing-fe
        run: bun run format:check

      - name: linting
        working-directory: ./auditing-fe
        run: bun run lint

      - name: build
        working-directory: ./auditing-fe
        run: bun run build
