name: deploy

on:
  workflow_call:

jobs:
  build-push:
    name: build & push images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: iac

    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION != '' && vars.GCP_REGION || 'us-central1' }}
      # Tag every image with the exact commit that passed CI
      TAG: ${{ github.sha }}
      NODE_ENV: demo
      VITE_NODE_ENV: demo

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2.1.2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare assets
        working-directory: ./
        run: make prepare-assets

      - name: Build & push images
        run: make build-push

  deploy:
    name: terraform apply
    needs: build-push
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: iac

    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION != '' && vars.GCP_REGION || 'us-central1' }}
      TAG: ${{ github.sha }}
      # HCP Terraform auth — TF_TOKEN_<hostname with dots→underscores>
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_INPUT: "false"
      TF_CLI_ARGS_apply: "-auto-approve"
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      NODE_ENV: demo

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ── GCP auth ──────────────────────────────────────────────────────────
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2.1.2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Build tooling ──────────────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # ── Terraform variable prep ────────────────────────────────────────────
      # Use jq so secret values with special characters can't break the JSON.
      # TF_VAR_image_tags is constructed by `make apply` from the TAG env var.
      - name: Build Terraform secret variables
        run: |
          auth=$(jq -cn \
            --arg bs  "$BETTER_AUTH_SECRET" \
            --arg db  "$AUTH_DB_URI"        \
            '{better_auth_secret:$bs,auth_db_uri:$db}')
          echo "TF_VAR_auth_secrets=$auth" >> "$GITHUB_ENV"

          backend=$(jq -cn --arg db "$ELECTIONS_DB_URI" '{elections_db_uri:$db}')
          echo "TF_VAR_backend_secrets=$backend" >> "$GITHUB_ENV"

          demo=$(jq -cn --arg key "$DEMO_VOTERS_DB_API_KEY" '{eligibility_api_key:$key}')
          echo "TF_VAR_demo_voters_db_secrets=$demo" >> "$GITHUB_ENV"

          chain=$(jq -cn --arg db "$CHAIN_DB_URI" '{chain_db_uri:$db}')
          echo "TF_VAR_chain_node_secrets=$chain" >> "$GITHUB_ENV"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_DB_URI: ${{ secrets.AUTH_DB_URI }}
          ELECTIONS_DB_URI: ${{ secrets.ELECTIONS_DB_URI }}
          DEMO_VOTERS_DB_API_KEY: ${{ secrets.DEMO_VOTERS_DB_API_KEY }}
          CHAIN_DB_URI: ${{ secrets.CHAIN_DB_URI }}

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Terraform init
        run: make init

      - name: Terraform apply
        run: make apply
